<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代号鸢成就收集进度</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: #fdf6e9;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #fffaf0;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #d9c5b2;
        }
        .header {
            background: #8B0000;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .add-achievement-area {
            padding: 15px 20px;
            background: #fef3e0;
            border-bottom: 1px solid #d9c5b2;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .add-achievement-area input {
            padding: 8px 10px;
            border: 1px solid #d9c5b2;
            border-radius: 6px;
            background: #fffaf0;
            color: #5c4033;
            font-size: 14px;
        }
        .add-achievement-area input.name-inp {
            width: 180px;
        }
        .add-achievement-area input.num-inp {
            width: 80px;
        }
        .add-achievement-area input.note-inp {
            flex: 1;
            min-width: 200px;
        }
        .add-achievement-area button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: #8B0000;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .add-achievement-area button:hover {
            background: #7a1f2d;
        }
        .search-bar {
            padding: 15px 20px;
            background: #faf5e8;
            border-bottom: 1px solid #d9c5b2;
        }
        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #d9c5b2;
            border-radius: 8px;
            font-size: 14px;
            background: #fffaf0;
            color: #5c4033;
        }
        .stats {
            padding: 15px 20px;
            background: #faf5e8;
            border-bottom: 1px solid #d9c5b2;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: #8c6a56;
        }
        .stat-item {
            font-size: 14px;
            color: #8c6a56;
        }
        .stat-item strong {
            color: #5c4033;
            font-size: 16px;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background: #faf5e8;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #d9c5b2;
            font-size: 14px;
        }
        th {
            font-weight: 600;
            color: #5c4033;
            position: sticky;
            top: 0;
            background: #faf5e8;
            z-index: 10;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e6d5c2;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-fill {
            height: 100%;
            background: #166534;
            border-radius: 4px;
        }
        .progress-low .progress-fill {
            background: #d97706;
        }
        .progress-high .progress-fill {
            background: #166534;
        }
        .progress-zero .progress-fill {
            background: #8B0000;
        }
        .note {
            color: #8c6a56;
            font-size: 13px;
            line-height: 1.5;
        }
        tr:hover {
            background: #faf5e8;
        }
        tr.achievement-completed {
            opacity: 0.5;
            color: #999;
        }
        tr.achievement-completed:hover {
            background: #faf5e8;
            opacity: 0.6;
        }
        input.current-input {
            width: 80px;
            padding: 4px 6px;
            border: 1px solid #d9c5b2;
            border-radius: 4px;
            text-align: center;
            background: #fffaf0;
            color: #5c4033;
        }
        .add-custom {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .add-custom input {
            width: 60px;
            padding: 4px;
            border: 1px solid #d9c5b2;
            border-radius: 4px;
            text-align: center;
            background: #fffaf0;
            color: #5c4033;
        }
        .add-custom button {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            background: #8B0000;
            color: white;
            cursor: pointer;
            font-size: 12px;
        }
        .add-custom button:hover {
            background: #7a1f2d;
        }
    </style>
</head>

        <div class="add-achievement-area">

            <input type="text" id="newAchNote" class="note-inp" placeholder="备注说明">
            <button id="addNewAchBtn">添加成就</button>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="搜索成就名称或备注...">
        </div>
        <div class="stats" id="stats"></div>
        <div class="table-wrapper">

            { name: "喜怒不形羽色", current: 34, target: 1500, note: "张松累计获得1500层【毫羽】" },
            { name: "翻手为云覆手为羽", current: 34, target: 5000, note: "张松累计获得5000层【毫羽】" },
            { name: "年轻人下手没轻没重的", current: 20, target: 2000, note: "孙辅累计获得2000层【利刺】" },
            { name: "不再依赖黄盖将军算长大吗", current: 20, target: 4000, note: "孙辅累计获得4000层【利刺】" }
        ];

        function saveData(){
            localStorage.setItem(STORAGE_KEY, JSON.stringify(achievements));
        }
        function loadData(){
            let d = localStorage.getItem(STORAGE_KEY);
            achievements = d ? JSON.parse(d) : [...initialData];
        }

        function sortAchievements(arr){
            return arr.sort((a,b)=>{
                let aDone = a.current >= a.target;
                let bDone = b.current >= b.target;
                if(aDone && !bDone) return 1;
                if(!aDone && bDone) return -1;
                return 0;
            });
        }

        function render(keyword=""){
            let tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            let filter = achievements.filter(x=>x.name.includes(keyword) || x.note.includes(keyword));

            sortAchievements(filter).forEach((item, idx)=>{
                let pct = (item.current / item.target * 100).toFixed(2);
                let cls = item.current===0 ? "progress-zero" : (pct<30 ? "progress-low" : "progress-high");
                let row = document.createElement("tr");
                if(item.current >= item.target) row.classList.add("achievement-completed");
                row.innerHTML = `
                    <td>${item.name}</td>
                    <td><input class="current-input" data-rowidx="${idx}" value="${item.current}" min="0" max="${item.target}"></td>
                    <td>${item.target}</td>
                    <td>
                        <div class="add-custom">
                            <input class="add-val" data-rowidx="${idx}" type="number" min="1" placeholder="数值">
                            <button class="add-btn" data-rowidx="${idx}">增加</button>
                        </div>
                    </td>
                    <td>${pct}%</td>
                    <td><div class="progress-bar ${cls}"><div class="progress-fill" style="width:${pct}%"></div></div></td>
                    <td class="note">${item.note}</td>
                `;
                tbody.appendChild(row);
            });

            let total = achievements.length;
            let done = achievements.filter(x=>x.current>=x.target).length;
            let ing = achievements.filter(x=>x.current>0 && x.current<x.target).length;
            let none = achievements.filter(x=>x.current===0).length;
            document.getElementById("stats").innerHTML = `
                <div class="stat-item"><strong>总成就数：</strong>${total}</div>
                <div class="stat-item"><strong>已完成：</strong>${done}</div>
                <div class="stat-item"><strong>进行中：</strong>${ing}</div>
                <div class="stat-item"><strong>未开始：</strong>${none}</div>
            `;
        }

        // 事件委托 一次性绑定所有动态元素
        document.getElementById("tableBody").addEventListener("change", e=>{
            if(e.target.classList.contains("current-input")){
                let idx = Number(e.target.dataset.rowidx);
                let val = Math.max(0, Math.min(achievements[idx].target, Number(e.target.value)||0));
                achievements[idx].current = val;
                saveData();
                render(document.getElementById("searchInput").value);
            }
        });

        document.getElementById("tableBody").addEventListener("click", e=>{
            if(e.target.classList.contains("add-btn")){
                let idx = Number(e.target.dataset.rowidx);
                let inp = document.querySelector(`.add-val[data-rowidx="${idx}"]`);
                let num = Number(inp.value)||0;
                if(num<=0) return;
                achievements[idx].current = Math.min(achievements[idx].target, achievements[idx].current + num);
                saveData();
                render(document.getElementById("searchInput").value);
            }
        });

        // 新增成就
        document.getElementById("addNewAchBtn").addEventListener("click", ()=>{
            let name = document.getElementById("newAchName").value.trim();
            let curr = Number(document.getElementById("newAchCurrent").value)||0;
            let tgt = Number(document.getElementById("newAchTarget").value)||100;
            let note = document.getElementById("newAchNote").value.trim();
            if(!name){alert("请输入成就名称");return;}
            if(tgt<1){alert("目标数值必须大于0");return;}
            achievements.push({name, current:curr, target:tgt, note});
            saveData();
            document.getElementById("newAchName").value = "";
            document.getElementById("newAchCurrent").value = "0";
            document.getElementById("newAchTarget").value = "100";
            document.getElementById("newAchNote").value = "";
            render("");
        });

        // 搜索
        document.getElementById("searchInput").addEventListener("input", e=>{
            render(e.target.value.trim());
        });

        // 初始化
        loadData();
        render("");
    </script>
</body>
</html>
