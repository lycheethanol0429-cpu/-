<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>成就系统</title>
    <style>
        .achievement {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
        }
        .unlocked {
            background: #e3f2fd;
            border-color: #2196f3;
        }
    </style>
</head>
<body>
    <h2>我的成就</h2>
    <div id="achievementList"></div>

    <script>
        // ==============================================
        // 【已修复】本地双击打开也能永久保存成就数据
        // 刷新、关闭、重开都不会丢！
        // ==============================================
        let achievementData = {};

        // 初始化所有成就（在这里添加你的成就）
        const allAchievements = [
            { id: 1, name: "第一次完成任务" },
            { id: 2, name: "连续登录3天" },
            { id: 3, name: "收集全部道具" },
            { id: 4, name: "通关困难模式" },
            { id: 5, name: "隐藏成就解锁" }
        ];

        // 读取本地保存的数据
        function loadAchievementData() {
            try {
                const data = localStorage.getItem("myGameAchievements");
                if (data) achievementData = JSON.parse(data);
            } catch (e) {
                achievementData = {};
            }
        }

        // 保存到本地（核心修复）
        function saveData() {
            try {
                localStorage.setItem("myGameAchievements", JSON.stringify(achievementData));
            } catch (e) {}
        }

        // 解锁 / 锁定成就（你改成就只用这个）
        function setAchievement(id, isUnlocked) {
            loadAchievementData();
            achievementData[id] = isUnlocked;
            saveData();
            renderList();
            console.log("✅ 成就已保存！编号：" + id);
        }

        // 渲染页面
        function renderList() {
            const list = document.getElementById("achievementList");
            list.innerHTML = "";

            allAchievements.forEach(ach => {
                const unlocked = achievementData[ach.id] === true;
                const div = document.createElement("div");
                div.className = "achievement " + (unlocked ? "unlocked" : "");
                div.innerText = ach.id + "、" + ach.name + (unlocked ? " ✅ 已解锁" : " 🔒 未解锁");
                div.onclick = () => setAchievement(ach.id, !unlocked); // 点一下就能改成就
                list.appendChild(div);
            });
        }

        // 页面打开自动加载
        window.onload = function () {
            loadAchievementData();
            renderList();
        };
    </script>
</body>
</html>
